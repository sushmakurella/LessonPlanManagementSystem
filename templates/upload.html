<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload PDF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #9642f1, #508cf3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        .btn-custom {
            background: #6a11cb;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background: #2575fc;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2 class="text-center text-primary">Upload PDF</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.n.label_tag }}
                {{ form.n }}
            </div>
            <div class="mb-3">
                {{ form.pdf_file.label_tag }}
                {{ form.pdf_file }}
            </div>
            <button type="submit" class="btn btn-custom w-100">Submit</button>
        </form>
    </div>
</body>

</html>
