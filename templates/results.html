<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Extracted Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">Course Details</h2>
        <form method="post" class="bg-white p-4 rounded shadow">
            {% csrf_token %}

            <div class="mb-3 row">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Batch:</label>
                    <input type="text" class="form-control" name="batch" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Academic Year:</label>
                    <input type="text" class="form-control" name="academic_year" required>
                </div>
            </div>

            <div class="mb-3 row">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Programme:</label>
                    <input type="text" class="form-control" name="programme" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Semester:</label>
                    <input type="text" class="form-control" name="semester" required>
                </div>
            </div>

            <div class="mb-3 row">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Section:</label>
                    <input type="text" class="form-control" name="section" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Course Name:</label>
                    <input type="text" class="form-control" name="course_name" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Course Code:</label>
                <input type="text" class="form-control" name="course_code" required>
            </div>

            <h2 class="text-center mt-4">Extracted Course Outcomes</h2>
            {% for co, details in course_outcomes.items %}
            <div class="mb-3">
                <label class="form-label fw-bold">{{ co }}:</label>
                <div class="row g-2">
                    <div class="col-md-6">
                        <input type="text" class="form-control" name="co_text_{{ co }}" value="{{ details.0 }}"
                            required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" name="co_knowledge_{{ co }}" value="{{ details.1 }}"
                            required>
                    </div>
                </div>
            </div>
            {% endfor %}

            <h2 class="text-center mt-4">Extracted Units</h2>
            {% for unit, details in units.items %}
            <div class="mb-4 p-3 border rounded">
                <h4 class="mb-3">{{ unit }}:
                    <input type="text" class="form-control d-inline-block w-auto" name="unit_name_{{ unit }}"
                        value="{{ details.name }}" required>
                </h4>
                <ul class="list-group">
                    {% for topic in details.Syllabus %}
                    <li class="list-group-item d-flex align-items-center gap-2">
                        <input type="text" class="form-control" name="unit_{{ unit }}_topic_{{ forloop.counter }}"
                            value="{{ topic }}" required>
                        <select class="form-select" name="unit_{{ unit }}_knowledge_{{ forloop.counter }}">
                            {% for co, co_details in course_outcomes.items %}
                            <option value="{{ co_details.1 }}" {% if co_details.1 in topic %}selected{% endif %}>
                                {{ co_details.1 }}
                            </option>
                            {% endfor %}
                        </select>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            {% endfor %}

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'upload_pdf' %}" class="btn btn-outline-secondary">Upload Another PDF</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
